# Local hooks use the project venv so no hook repositories need downloading.
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: .venv/bin/ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: .venv/bin/ruff format
        language: system
        types: [python]
      - id: schemas
        name: schemas up to date
        entry: .venv/bin/simcore schemas export --out schemas
        language: system
        pass_filenames: false
        files: ^src/simcore/specs/
