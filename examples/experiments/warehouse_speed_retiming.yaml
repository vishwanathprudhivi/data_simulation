# BRD 9 example 3: speed re-timing vs baseline, paired with CRN.
schema_version: "1.0"
id: wh_speed_retiming
base_scenario: ../scenarios/warehouse/narrow_aisles.yaml
variants:
  - id: retimed
    name: Aisles 1-2 at 80% speed in hour 1
    overrides:
      params.speed_windows:
        - {zones: [aisle_01, aisle_02], start: 0, end: 3600, factor: 0.8}
replications: 10
master_seed: 3
crn: true
kpis: [bay_colocation_time, blocked_time_per_agent, cycle_time_mean, dock_on_time_rate]
parallelism: 4
