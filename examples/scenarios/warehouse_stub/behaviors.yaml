schema_version: "1.0"
agent_types:
  - id: pallet_jack_operator
    description: Operator with a triple pallet jack
    capabilities: [move_pallets]
    footprint: {length: 3.2 m, width: 0.8 m}
    speeds: {empty: 1.6 m/s, loaded: 1.1 m/s}
    capacity: 3
    service_times:
      pick: {kind: lognormal, mu: 3.4, sigma: 0.3}
    speed_multiplier: {kind: normal, mean: 1.0, sd: 0.08, min: 0.6}
