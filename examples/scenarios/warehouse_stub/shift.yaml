schema_version: "1.0"
id: warehouse_stub_shift
name: Warehouse placeholder shift (pre-M3)
domain: warehouse
behaviors: behaviors.yaml
duration: 4 h
warmup: 30 min
seed: 7
fleet:
  - agent_type: pallet_jack_operator
    count: 12
demand:
  - kind: stochastic
    task_type: pick_and_stage
    interarrival: {kind: exponential, mean: 25}
    due_after: {kind: constant, value: 2700}
    origins: [pick_A, pick_B, pick_C]
    destinations: [stage_1, stage_2]
params:
  travel_time: {kind: gamma, shape: 4, scale: 15}
disruptions:
  - id: labor_shortfall
    type: resource_unavailable
    at: 2 h
    duration: 30 min
    target: type:pallet_jack_operator
    params: {count: 3}
